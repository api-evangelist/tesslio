openapi: 3.1.1
info:
  title: Tessl Admin Keys Reviews API
  version: 1.0.0
  description: Admin-scoped API keys for support tooling.
servers:
- url: https://api.tessl.io
tags:
- name: Reviews
paths:
  /experimental/reviews:
    get:
      tags:
      - Reviews
      description: Lists review runs from both the quality and security tables, each tagged with its kind, newest first.
      parameters:
      - schema:
          minimum: 1
          maximum: 100
          default: 100
          type: integer
        in: query
        name: page[size]
        required: false
      - schema:
          type: string
        in: query
        name: page[after]
        required: false
      - schema:
          type: string
        in: query
        name: page[before]
        required: false
      - schema:
          format: uuid
          type: string
        in: query
        name: filter[workspaceId]
        required: false
      - schema:
          format: uuid
          type: string
        in: query
        name: filter[workspaceId][eq]
        required: false
      - schema:
          anyOf:
          - type: string
            enum:
            - pending
          - type: string
            enum:
            - completed
          - type: string
            enum:
            - failed
        in: query
        name: filter[status]
        required: false
      - schema:
          anyOf:
          - type: string
            enum:
            - pending
          - type: string
            enum:
            - completed
          - type: string
            enum:
            - failed
        in: query
        name: filter[status][eq]
        required: false
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - meta
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    - next
                    - prev
                    properties:
                      self:
                        format: uri
                        type: string
                      next:
                        anyOf:
                        - format: uri
                          type: string
                        - type: 'null'
                      prev:
                        anyOf:
                        - format: uri
                          type: string
                        - type: 'null'
                  meta:
                    type: object
                    required:
                    - count
                    properties:
                      count:
                        type: number
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          format: uuid
                          type: string
                        type:
                          type: string
                          enum:
                          - review
                        attributes:
                          anyOf:
                          - type: object
                            required:
                            - kind
                            - status
                            - workflowId
                            - workspaceId
                            - createdBy
                            - score
                            - results
                            - metadata
                            - config
                            - createdAt
                            - updatedAt
                            properties:
                              kind:
                                type: string
                                enum:
                                - quality
                              status:
                                anyOf:
                                - type: string
                                  enum:
                                  - pending
                                - type: string
                                  enum:
                                  - completed
                                - type: string
                                  enum:
                                  - failed
                              workflowId:
                                anyOf:
                                - type: string
                                - type: 'null'
                              workspaceId:
                                anyOf:
                                - format: uuid
                                  type: string
                                - type: 'null'
                              createdBy:
                                anyOf:
                                - format: uuid
                                  type: string
                                - type: 'null'
                              score:
                                anyOf:
                                - minimum: 0
                                  maximum: 100
                                  type: integer
                                - type: 'null'
                              results:
                                anyOf:
                                - {}
                                - type: 'null'
                              metadata:
                                additionalProperties: true
                                type: object
                                required:
                                - tier
                                properties:
                                  tier:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - anonymous
                                    - type: string
                                      enum:
                                      - authed_free
                                  pathLabel:
                                    type: string
                                  source:
                                    type: string
                                  subject:
                                    anyOf:
                                    - type: object
                                      required:
                                      - type
                                      - name
                                      - path
                                      - tileRef
                                      - registryUrl
                                      properties:
                                        type:
                                          type: string
                                          enum:
                                          - tile_skill
                                        name:
                                          type: string
                                        path:
                                          type: string
                                        tileRef:
                                          type: string
                                        registryUrl:
                                          type: string
                                    - type: object
                                      required:
                                      - type
                                      - name
                                      properties:
                                        type:
                                          type: string
                                          enum:
                                          - skill
                                        name:
                                          type: string
                                        path:
                                          type: string
                                  reusedFromReviewRunId:
                                    format: uuid
                                    type: string
                              config:
                                additionalProperties: true
                                type: object
                                required:
                                - agent
                                - model
                                properties:
                                  agent:
                                    type: string
                                  model:
                                    type: string
                              createdAt:
                                format: date-time
                                type: string
                              updatedAt:
                                format: date-time
                                type: string
                              progress:
                                type: object
                                required:
                                - queue
                                - recipes
                                properties:
                                  queue:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - preparing
                                    - type: string
                                      enum:
                                      - queued
                                    - type: string
                                      enum:
                                      - active
                                    - type: string
                                      enum:
                                      - finishing
                                  recipes:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - name
                                      - waiting
                                      - running
                                      - completed
                                      properties:
                                        name:
                                          type: string
                                        waiting:
                                          minimum: 0
                                          type: integer
                                        running:
                                          minimum: 0
                                          type: integer
                                        completed:
                                          minimum: 0
                                          type: integer
                                  summary:
                                    type: object
                                    required:
                                    - label
                                    - completed
                                    - failed
                                    properties:
                                      label:
                                        type: string
                                      total:
                                        minimum: 0
                                        type: integer
                                      completed:
                                        minimum: 0
                                        type: integer
                                      failed:
                                        minimum: 0
                                        type: integer
                                  units:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                      - name
                                      - percent
                                      - waiting
                                      properties:
                                        name:
                                          type: string
                                        percent:
                                          minimum: 0
                                          maximum: 100
                                          type: integer
                                        waiting:
                                          type: boolean
                          - type: object
                            required:
                            - kind
                            - status
                            - workflowId
                            - workspaceId
                            - createdBy
                            - overallSeverity
                            - results
                            - metadata
                            - createdAt
                            - updatedAt
                            properties:
                              kind:
                                type: string
                                enum:
                                - security
                              status:
                                anyOf:
                                - type: string
                                  enum:
                                  - pending
                                - type: string
                                  enum:
                                  - completed
                                - type: string
                                  enum:
                                  - failed
                              workflowId:
                                anyOf:
                                - type: string
                                - type: 'null'
                              workspaceId:
                                format: uuid
                                type: string
                              createdBy:
                                anyOf:
                                - format: uuid
                                  type: string
                                - type: 'null'
                              overallSeverity:
                                anyOf:
                                - anyOf:
                                  - type: string
                                    enum:
                                    - LOW
                                  - type: string
                                    enum:
                                    - MEDIUM
                                  - type: string
                                    enum:
                                    - HIGH
                                  - type: string
                                    enum:
                                    - CRITICAL
                                - type: 'null'
                              results:
                                anyOf:
                                - type: object
                                  required:
                                  - verdict
                                  - overallSeverity
                                  - findings
                                  properties:
                                    verdict:
                                      anyOf:
                                      - type: string
                                        enum:
                                        - pass
                                      - type: string
                                        enum:
                                        - fail
                                    overallSeverity:
                                      anyOf:
                                      - anyOf:
                                        - type: string
                                          enum:
                                          - LOW
                                        - type: string
                                          enum:
                                          - MEDIUM
                                        - type: string
                                          enum:
                                          - HIGH
                                        - type: string
                                          enum:
                                          - CRITICAL
                                      - type: 'null'
                                    findings:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - severity
                                        - code
                                        - title
                                        - reasoning
                                        - issueDescription
                                        properties:
                                          severity:
                                            anyOf:
                                            - type: string
                                              enum:
                                              - CRITICAL
                                            - type: string
                                              enum:
                                              - HIGH
                                            - type: string
                                              enum:
                                              - MEDIUM
                                            - type: string
                                              enum:
                                              - LOW
                                          code:
                                            type: string
                                          title:
                                            type: string
                                          reasoning:
                                            type: string
                                          issueDescription:
                                            anyOf:
                                            - type: string
                                            - type: 'null'
                                - type: 'null'
                              metadata:
                                additionalProperties: true
                                type: object
                                required:
                                - tier
                                properties:
                                  tier:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - anonymous
                                    - type: string
                                      enum:
                                      - authed_free
                                  subject:
                                    type: object
                                    required:
                                    - type
                                    - name
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - skill
                                      name:
                                        type: string
                                      path:
                                        type: string
                                  source:
                                    type: string
                                  label:
                                    type: string
                              createdAt:
                                format: date-time
                                type: string
                              updatedAt:
                                format: date-time
                                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
                    properties:
                      title:
                        type: string
                        enum:
                        - Unauthorized
                      status:
                        type: number
                        enum:
                        - 401
                      message:
                        type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                description: Forbidden
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
                    properties:
                      title:
                        type: string
                        enum:
                        - Forbidden
                      status:
                        type: number
                        enum:
                        - 403
                      message:
                        type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                description: Not Found
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
                    properties:
                      title:
                        type: string
                        enum:
                        - Not Found
                      status:
                        type: number
                        enum:
                        - 404
                      message:
                        type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: Internal Server Error
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
                    properties:
                      title:
                        type: string
                        enum:
                        - Internal Server Error
                      status:
                        type: number
                        enum:
                        - 500
                      message:
                        type: string
  /experimental/reviews/{id}:
