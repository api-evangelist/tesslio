  /experimental/reviews/{id}/retry:
    post:
      tags:
      - Reviews
      description: Retries a failed review run, resolving its kind and routing to that kind’s retry logic. Returns the newly created run as a kind-tagged review.
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        format: uuid
                        type: string
                      type:
                        type: string
                        enum:
                        - review
                      attributes:
                        anyOf:
                        - type: object
                          required:
                          - kind
                          - status
                          - workflowId
                          - workspaceId
                          - createdBy
                          - score
                          - results
                          - metadata
                          - config
                          - createdAt
                          - updatedAt
                          properties:
                            kind:
                              type: string
                              enum:
                              - quality
                            status:
                              anyOf:
                              - type: string
                                enum:
                                - pending
                              - type: string
                                enum:
                                - completed
                              - type: string
                                enum:
                                - failed
                            workflowId:
                              anyOf:
                              - type: string
                              - type: 'null'
                            workspaceId:
                              anyOf:
                              - format: uuid
                                type: string
                              - type: 'null'
                            createdBy:
                              anyOf:
                              - format: uuid
                                type: string
                              - type: 'null'
                            score:
                              anyOf:
                              - minimum: 0
                                maximum: 100
                                type: integer
                              - type: 'null'
                            results:
                              anyOf:
                              - {}
                              - type: 'null'
                            metadata:
                              additionalProperties: true
                              type: object
                              required:
                              - tier
                              properties:
                                tier:
                                  anyOf:
