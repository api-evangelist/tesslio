                                    enum:
                                    - finishing
                                recipes:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - name
                                    - waiting
                                    - running
                                    - completed
                                    properties:
                                      name:
                                        type: string
                                      waiting:
