                                    - name
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - skill
                                      name:
                                        type: string
                                      path:
                                        type: string
                                reusedFromReviewRunId:
                                  format: uuid
                                  type: string
                            config:
                              additionalProperties: true
                              type: object
                              required:
