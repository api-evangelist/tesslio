                                    - source
                                    - url
                                    properties:
                                      id:
                                        type: string
                                      source:
                                        type: string
                                        enum:
                                        - git
                                      url:
                                        type: string
                                      branch:
                                        type: string
                                      subpath:
                                        type: string
                                  - type: object
                                    required:
