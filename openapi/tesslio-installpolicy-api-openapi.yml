                        type: string
                      type:
                        type: string
                        enum:
                        - install-policy-evaluation
                      attributes:
                        type: object
                        required:
                        - policyVersion
                        - orgId
                        - decisions
                        - additionalSources
                        properties:
                          policyVersion:
                            type: string
                          orgId:
                            anyOf:
                            - type: string
                            - type: 'null'
                          decisions:
                            type: array
                            items:
                              type: object
                              required:
                              - id
                              - decision
                              - reasons
                              - requiresInteractiveConfirmation
                              properties:
