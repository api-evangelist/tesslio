openapi: 3.1.1
info:
  title: Tessl Admin Keys InstallPolicy API
  version: 1.0.0
  description: Admin-scoped API keys for support tooling.
servers:
- url: https://api.tessl.io
tags:
- name: InstallPolicy
paths:
  /v1/install/policy/evaluate:
    post:
      summary: Evaluate an install policy decision for a batch of plugin sources
      tags:
      - InstallPolicy
      description: Returns a per-source allow/warn/block decision plus structured reasons. For users who belong to multiple orgs, the lowest-sorted org id wins and a warning is logged — set up an org-scoped API key to avoid the picker's arbitrary choice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sources
              properties:
                clientVersion:
                  type: string
                context:
                  type: object
                  properties:
                    isCi:
                      type: boolean
                    runId:
                      type: string
                    project:
                      type: object
                      properties:
                        tesslProjectId:
                          anyOf:
                          - type: string
                          - type: 'null'
                        workspaceSlug:
                          anyOf:
                          - maxLength: 200
                            type: string
                          - type: 'null'
                        manifestPath:
                          type: string
                        gitRemoteUrl:
                          anyOf:
                          - type: string
                          - type: 'null'
                        gitCommitSha:
                          anyOf:
                          - type: string
                          - type: 'null'
                acceptedWarnings:
                  type: boolean
                sources:
                  minItems: 0
                  maxItems: 200
                  type: array
                  items:
                    anyOf:
                    - type: object
                      required:
                      - id
                      - source
                      - tile
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                          enum:
                          - registry
                        tile:
                          type: object
                          required:
                          - workspaceName
                          - tileName
                          properties:
                            workspaceName:
                              type: string
                            tileName:
                              type: string
                            version:
                              type: string
                    - type: object
                      required:
                      - id
                      - source
                      - url
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                          enum:
                          - git
                        url:
                          type: string
                        branch:
                          type: string
                        subpath:
                          type: string
                        skills:
                          maxItems: 200
                          type: array
                          items:
                            type: string
                    - type: object
                      required:
                      - id
                      - source
                      - path
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                          enum:
                          - file
                        path:
                          type: string
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
