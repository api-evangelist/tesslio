  /experimental/workspaces/{workspaceId}/integrations/github-app:
    post:
      tags:
      - Integrations
      description: Completes a GitHub App OAuth handshake, attaching the installation to a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - installationId
              properties:
                code:
                  type: string
                installationId:
                  type: number
      parameters:
      - schema:
          type: string
        in: path
        name: workspaceId
        required: true
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        format: uuid
                        type: string
                      type:
                        type: string
                        enum:
                        - integration
                      attributes:
                        type: object
                        required:
                        - type
                        - installedBy
                        - connectionData
                        - metadata
                        - createdAt
                        - updatedAt
                        properties:
                          type:
                            type: string
                            enum:
                            - github-app
                          installedBy:
                            format: uuid
