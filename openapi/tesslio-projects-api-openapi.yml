  /v1/projects/validate:
    post:
      summary: Validate a project source binding
      tags:
      - Projects
      description: Validates whether a locator/source pair maps to an existing project, surfacing drift or conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
              - source
              properties:
                locator:
                  type: object
                  required:
                  - workspaceName
                  - projectName
                  properties:
                    workspaceName:
                      minLength: 1
                      type: string
                    projectName:
                      minLength: 1
                      type: string
                source:
                  type: object
                  required:
                  - sourceType
                  - sourceUri
                  properties:
                    sourceType:
                      minLength: 1
                      maxLength: 64
                      type: string
                    sourceUri:
                      minLength: 1
                      maxLength: 2048
                      type: string
                    repoSubpath:
                      maxLength: 4096
                      type: string
      parameters:
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum:
                        - project-validation
                      attributes:
                        type: object
                        required:
                        - locator
                        - source
                        - outcome
                        - allowedActions
                        - linkedProject
                        - sourceMatches
                        properties:
                          locator:
                            anyOf:
                            - type: object
                              required:
                              - workspaceName
                              - projectName
                              properties:
                                workspaceName:
                                  minLength: 1
                                  type: string
                                projectName:
                                  minLength: 1
                                  type: string
                            - type: 'null'
                          source:
                            type: object
                            required:
                            - sourceType
                            - sourceUri
                            - repoSubpath
                            properties:
                              sourceType:
                                type: string
                              sourceUri:
                                type: string
                              repoSubpath:
                                type: string
                          outcome:
                            anyOf:
                            - type: string
                              enum:
                              - match
                            - type: string
                              enum:
                              - locator_drift
                            - type: string
                              enum:
                              - provenance_drift
                            - type: string
                              enum:
                              - full_mismatch
