                    - repoName
                    properties:
                      type:
                        type: string
                        enum:
                        - commit
                      orgName:
                        type: string
                      repoName:
                        type: string
                      commit:
                        minLength: 7
                        maxLength: 82
                        type: string
                      pullRequestNumber:
                        minimum: 1
                        type: integer
                      contextPatterns:
                        type: array
                        items:
                          type: string
                      repoArchiveUpload:
                        type: object
                        required:
                        - archiveUploadKey
                        - commitDetails
                        - repoCloneUrl
                        - defaultBranch
                        - parentCommitHash
                        properties:
                          archiveUploadKey:
                            description: S3 uploads key for repo archive at HEAD of default branch
