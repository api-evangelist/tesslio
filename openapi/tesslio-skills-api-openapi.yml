                                        anyOf:
                                        - type: object
                                          additionalProperties: {}
                                        - type: 'null'
                                      createdAt:
                                        format: date-time
                                        type: string
                                      updatedAt:
                                        format: date-time
                                        type: string
                                      runs:
                                        type: array
                                        items:
                                          anyOf:
                                          - type: object
                                            required:
                                            - status
                                            - solutionId
                                            - score
                                            - createdAt
                                            properties:
                                              status:
                                                type: string
                                                enum:
                                                - completed
                                              solutionId:
                                                format: uuid
                                                type: string
                                              score:
                                                anyOf:
                                                - type: number
                                                - type: 'null'
                                              createdAt:
                                                format: date-time
                                                type: string
                                          - type: object
                                            required:
                                            - status
                                            properties:
                                              status:
                                                type: string
                                                enum:
                                                - pending
                                      activation:
                                        type: object
                                        required:
                                        - activatedSkills
                                        properties:
                                          activatedSkills:
                                            type: array
                                            items:
                                              type: string
                          expectedVariants:
                            type: array
                            items:
                              anyOf:
                              - type: string
                                enum:
                                - baseline
                              - type: string
                                enum:
                                - usage-spec
                          lastScoredAt:
                            anyOf:
                            - format: date-time
