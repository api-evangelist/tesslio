      description: Returns the eval suite (latest run + scenarios) for a skill identified by provider/owner/repo/name.
      parameters:
      - schema:
          type: string
        in: path
        name: provider
        required: true
      - schema:
          type: string
        in: path
        name: owner
        required: true
      - schema:
          type: string
        in: path
        name: repo
        required: true
      - schema:
          type: string
        in: path
        name: skillName
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        format: uuid
                        type: string
                      type:
                        type: string
                        enum:
                        - eval-suite
                      attributes:
                        type: object
                        required:
                        - status
                        - scenarios
                        - expectedVariants
                        - lastScoredAt
                        properties:
                          status:
                            anyOf:
                            - type: string
                              enum:
                              - pending
                            - type: string
                              enum:
                              - completed
                            - type: string
                              enum:
                              - failed
                          scenarios:
                            type: array
                            items:
                              type: object
                              required:
                              - id
                              - fingerprint
                              - task
                              - rubric
                              - createdAt
                              - updatedAt
