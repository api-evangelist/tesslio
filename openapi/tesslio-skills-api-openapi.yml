                                    context:
                                      minLength: 1
                                      type: string
                                    type:
                                      type: string
                                      enum:
                                      - weighted_checklist
                                    checklist:
                                      minItems: 1
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - name
                                        - description
                                        - max_score
                                        properties:
                                          name:
                                            minLength: 1
                                            type: string
                                          description:
                                            minLength: 1
                                            type: string
                                          max_score:
                                            minimum: 0
                                            type: number
                                qualityAssessment:
                                  type: object
                                  required:
                                  - feasibility
                                  - feasibility_notes
                                  - leakage
                                  - leakage_evidence
                                  - scenario_value
                                  - scenario_value_notes
                                  - assessed_at
                                  - model
                                  properties:
                                    feasibility:
                                      anyOf:
                                      - type: string
                                        enum:
                                        - FEASIBLE
                                      - type: string
                                        enum:
                                        - NOT_FEASIBLE
                                    feasibility_notes:
                                      type: string
                                    leakage:
                                      anyOf:
                                      - type: string
                                        enum:
                                        - NO_LEAKAGE
                                      - type: string
                                        enum:
                                        - LOW_LEAKAGE
                                      - type: string
                                        enum:
                                        - MEDIUM_LEAKAGE
                                      - type: string
                                        enum:
                                        - HIGH_LEAKAGE
                                    leakage_evidence:
                                      type: array
                                      items:
                                        type: object
                                        required:
                                        - scenario_statement
                                        - criteria_rubric
                                        properties:
                                          scenario_statement:
                                            type: string
                                          criteria_rubric:
                                            type: string
                                    scenario_value:
                                      anyOf:
                                      - type: string
                                        enum:
                                        - LOW
                                      - type: string
                                        enum:
                                        - MEDIUM
                                      - type: string
                                        enum:
                                        - HIGH
                                    scenario_value_notes:
                                      type: string
                                    assessed_at:
                                      format: date-time
                                      type: string
                                    model:
                                      type: string
                                qualityFilterStatus:
                                  anyOf:
                                  - type: string
                                    enum:
                                    - included
                                  - type: string
                                    enum:
                                    - rejected
                                createdAt:
                                  format: date-time
                                  type: string
                                updatedAt:
                                  format: date-time
                                  type: string
                                solutions:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - id
                                    - variant
                                    - solutionTarGZS3Key
                                    - solutionMetadata
                                    - assessmentResults
                                    - assessmentMetadata
                                    - createdAt
                                    - updatedAt
                                    properties:
                                      id:
                                        format: uuid
                                        type: string
                                      variant:
                                        anyOf:
                                        - type: string
                                          enum:
                                          - baseline
                                        - type: string
                                          enum:
                                          - usage-spec
                                      solutionTarGZS3Key:
                                        anyOf:
                                        - type: string
                                        - type: 'null'
                                      solutionMetadata:
                                        anyOf:
                                        - type: object
                                          additionalProperties: {}
                                        - type: 'null'
                                      assessmentResults:
                                        anyOf:
                                        - type: array
                                          items:
                                            type: object
                                            required:
                                            - name
                                            - score
                                            - reasoning
                                            properties:
                                              name:
                                                minLength: 1
                                                type: string
                                              score:
                                                minimum: 0
                                                type: number
                                              max_score:
