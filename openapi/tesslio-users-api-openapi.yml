  /v1/users/me/invitations/{invitationId}/accept:
    post:
      tags:
      - Users
      description: Explicitly accepts a pending invitation addressed to the authenticated user, joining them to the invited organization and workspaces.
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: invitationId
        required: true
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        format: uuid
                        type: string
                      type:
                        type: string
                        enum:
                        - invitation
                      attributes:
                        type: object
                        required:
                        - id
                        - orgId
                        - orgName
                        - email
                        - role
                        - expiresAt
                        - createdAt
                        - workspaces
                        properties:
                          id:
                            format: uuid
                            type: string
                          orgId:
                            format: uuid
                            type: string
                          orgName:
                            type: string
                          email:
                            format: email
                            type: string
                          role:
                            anyOf:
                            - type: string
                              enum:
                              - owner
                            - type: string
                              enum:
                              - manager
                            - type: string
                              enum:
                              - publisher
                            - type: string
                              enum:
                              - member
                            - type: string
                              enum:
                              - consumer
                          expiresAt:
                            format: date-time
                            type: string
                          createdAt:
                            format: date-time
                            type: string
                          workspaces:
                            type: array
                            items:
                              type: object
                              required:
                              - id
                              - name
                              properties:
                                id:
                                  format: uuid
                                  type: string
                                name:
                                  type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
                    properties:
                      title:
                        type: string
                        enum:
                        - Unauthorized
                      status:
                        type: number
                        enum:
                        - 401
                      message:
                        type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                description: Forbidden
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - title
                    - status
                    - message
