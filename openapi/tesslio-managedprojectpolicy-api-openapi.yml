                  type: object
                  required:
                  - dependencies
                  properties:
                    dependencies:
                      minProperties: 1
                      type: object
                      additionalProperties:
                        additionalProperties: false
                        type: object
                        required:
                        - version
                        properties:
                          version:
                            type: string
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: workspaceId
        required: true
