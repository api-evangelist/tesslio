    delete:
      tags:
      - ManagedProjectPolicy
      description: Deletes the current managed project policy for the workspace. Idempotent.
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: workspaceId
        required: true
      - schema:
          type: string
