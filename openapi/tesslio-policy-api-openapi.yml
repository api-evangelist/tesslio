openapi: 3.1.1
info:
  title: Tessl Admin Keys Policy API
  version: 1.0.0
  description: Admin-scoped API keys for support tooling.
servers:
- url: https://api.tessl.io
tags:
- name: Policy
paths:
  /v1/policy/evaluate:
    post:
      summary: Evaluate generic policy action decisions for a batch of requests
      tags:
      - Policy
      description: Returns generic policy decisions and follow-up requests for registered policy actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requests
              properties:
                clientVersion:
                  type: string
                context:
                  type: object
                  properties:
                    isCi:
                      type: boolean
                    runId:
                      type: string
                    project:
                      type: object
                      properties:
                        id:
                          type: string
                        workspaceSlug:
                          anyOf:
                          - maxLength: 200
                            type: string
                          - type: 'null'
                acceptedWarnings:
                  type: boolean
                requests:
                  maxItems: 200
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - action
                    - source
                    properties:
                      id:
                        type: string
                      action:
                        type: string
                      source: {}
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum:
                        - policy-evaluation
                      attributes:
                        type: object
                        required:
                        - policyVersion
                        - orgId
                        - evaluationId
                        - decisions
                        - additionalRequests
                        properties:
                          policyVersion:
                            type: string
                          orgId:
                            anyOf:
                            - type: string
                            - type: 'null'
                          evaluationId:
                            type: string
                          decisions:
                            type: array
                            items:
                              anyOf:
                              - type: object
                                required:
                                - id
                                - action
                                - decision
                                - reasons
                                - requiresInteractiveConfirmation
                                properties:
                                  id:
                                    type: string
                                  action:
                                    type: string
                                    enum:
                                    - install
                                  decision:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - allow
                                    - type: string
                                      enum:
                                      - warn
                                    - type: string
                                      enum:
                                      - block
                                  reasons:
                                    type: array
                                    items:
                                      anyOf:
                                      - type: object
                                        required:
                                        - kind
                                        - ruleId
                                        - severity
                                        - code
                                        - message
                                        - details
                                        properties:
                                          kind:
                                            type: string
                                            enum:
                                            - security-finding
                                          ruleId:
                                            type: string
                                          severity:
                                            anyOf:
                                            - type: string
                                              enum:
                                              - info
                                            - type: string
                                              enum:
                                              - warn
                                            - type: string
                                              enum:
                                              - error
                                          code:
                                            type: string
                                          message:
                                            type: string
                                          details:
                                            type: object
                                            required:
                                            - securityLevel
                                            - securityStatus
                                            - findings
                                            - registryUrl
                                            properties:
                                              securityLevel:
                                                anyOf:
