                                                  - MEDIUM
                                                  - HIGH
                                                  - CRITICAL
                                                  type: string
                                                - type: 'null'
                                              securityStatus:
                                                anyOf:
                                                - type: string
                                                  enum:
                                                  - completed
                                                - type: string
                                                  enum:
                                                  - failed
                                                - type: string
                                                  enum:
