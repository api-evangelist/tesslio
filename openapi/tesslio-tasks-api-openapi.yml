  /experimental/tasks/{id}/runs:
    get:
      tags:
      - Tasks
      description: List a task's `launch_run`s newest-first, each with status, failureReason, extracted links, the `run.created`/`run.completed` event ids, and its `resumeOfLaunchRunId` lineage.
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      - schema:
          type: string
        example: Bearer <token>
        in: header
        name: Authorization
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - meta
                - data
                properties:
                  links:
                    type: object
                    required:
                    - self
                    - next
                    - prev
                    properties:
                      self:
                        format: uri
                        type: string
                      next:
                        anyOf:
                        - format: uri
                          type: string
                        - type: 'null'
                      prev:
                        anyOf:
                        - format: uri
                          type: string
                        - type: 'null'
                  meta:
                    type: object
                    required:
                    - count
                    properties:
                      count:
                        type: number
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          format: uuid
                          type: string
                        type:
                          type: string
                          enum:
                          - launch-run
                        attributes:
                          type: object
                          required:
                          - status
                          - failureReason
                          - runCreatedEventId
                          - runCompletedEventId
                          - resumeOfLaunchRunId
                          - createdAt
                          properties:
                            status:
                              type: string
                            failureReason:
                              anyOf:
                              - type: object
                                additionalProperties: {}
                              - type: 'null'
                            links:
                              type: array
                              items:
                                type: object
                                required:
                                - type
                                - value
                                - eventId
                                properties:
                                  type:
                                    type: string
                                  value:
                                    type: string
                                  eventId:
                                    anyOf:
                                    - format: uuid
                                      type: string
                                    - type: 'null'
                                  displayLabel:
                                    type: string
                                  displayTitle:
                                    type: string
                                  displayUrl:
                                    type: string
                            runCreatedEventId:
                              anyOf:
                              - format: uuid
                                type: string
                              - type: 'null'
                            runCompletedEventId:
