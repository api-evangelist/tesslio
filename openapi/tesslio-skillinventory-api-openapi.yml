      tags:
      - SkillInventory
      description: 'Approves a selection of the inventory''s pending first-party logical skills, assigning each to a target workspace, and triggers private indexing of the latest scan so the newly approved skills are indexed. Each item''s target workspace must be one the actor may assign skills to (edit permission) and must belong to the same org as the inventory owner; a 404 is returned for one that is not editable and a 400 (workspace_cross_org) for one in another org. Duplicate logicalSkillId entries are rejected (400 duplicate_skills). Indexing is only triggered once the inventory has opted into private indexing — approvals are still recorded otherwise (attributes.indexing = "skipped"). Approvals are durable once committed: if starting the indexing workflow fails the request still succeeds and attributes.indexing reports "unavailable" or "failed" so the client can retry indexing without re-approving.'
