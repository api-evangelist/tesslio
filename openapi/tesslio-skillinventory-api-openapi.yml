                    properties:
                      self:
                        format: uri
                        type: string
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    properties:
                      id:
                        format: uuid
                        type: string
                      type:
                        type: string
                        enum:
                        - skill-inventory
                      attributes:
                        type: object
                        required:
                        - automaticScanningOptedInAt
                        properties:
                          automaticScanningOptedInAt:
                            format: date-time
                            type: string
