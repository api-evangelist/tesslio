aid: tesslio
name: tessl.io
description: >-
  Tessl is an agent-enablement platform for spec-driven and agentic software
  development. It provides a registry of versioned "tiles"/plugins (10,000+
  library docs) and 3,000+ searchable Agent Skills, a CLI for authoring, linting,
  reviewing, and publishing skills and plugins, server-side quality reviews and
  Snyk-powered security scanning, eval/scenario tooling to prove a skill changes
  agent behavior, org/workspace governance with install policies, and a
  first-party Model Context Protocol (MCP) server plus a workspace MCP gateway so
  AI coding agents can discover and install the right context. Backed by Index
  Ventures. The public REST API (api.tessl.io) exposes 225 operations across
  tiles, skills, workspaces, orgs, projects, evals, and integrations.
url: https://raw.githubusercontent.com/api-evangelist/tesslio/refs/heads/main/apis.yml
